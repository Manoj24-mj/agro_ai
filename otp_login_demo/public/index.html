<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Login Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Login</h1>
            
            <!-- Step 1: Request OTP -->
            <div id="step-1" class="step active">
                <p>Enter your phone number to receive a verification code.</p>
                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <!-- using oninput to strictly allow only numbers and a leading + sign -->
                    <input type="text" id="phone" placeholder="+1234567890" oninput="this.value = this.value.replace(/[^0-9+]/g, '')" />
                </div>
                <button id="send-btn" class="primary-btn">Send OTP</button>
                
                <div class="divider"><span>OR</span></div>
                
                <button id="google-btn" class="social-btn">
                    <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    Continue with Gmail
                </button>
            </div>

            <!-- Step 2: Verify OTP -->
            <div id="step-2" class="step">
                <p>Enter the 6-digit code sent to <span id="display-phone"></span></p>
                <div class="input-group">
                    <label for="otp">Verification Code</label>
                    <input type="text" id="otp" maxlength="6" placeholder="------" />
                </div>
                <button id="verify-btn" class="primary-btn">Verify & Login</button>
                <button id="back-btn" class="text-btn">Back</button>
            </div>

            <!-- Success -->
            <div id="step-3" class="step">
                <div class="success-icon">✓</div>
                <h2>Login Successful!</h2>
                <p>Welcome back securely.</p>
            </div>

            <div id="message" class="message"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
