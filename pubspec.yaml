name: agro_ai_app
description: AI Plant Disease Detection App

environment:
  sdk: "^3.11.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.2

  # Camera & Image
  image_picker: ^1.0.4

  # HTTP
  http: ^1.1.0

  # Voice
  speech_to_text: ^6.1.1
  flutter_tts: ^3.8.3

  # Firebase
  firebase_core: ^2.24.2
  cloud_firestore: ^4.13.6

  # Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Charts
  fl_chart: ^0.66.0

  # Maps
  google_maps_flutter: ^2.5.0

  # Offline DB
  sqflite: ^2.3.0
  path: ^1.8.3

  # State management (optional but good)
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter


